<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>London Live Trains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* London Live Trains — every Tube, DLR, Overground, Elizabeth line and tram train, live on Google Maps.
   (Shares its train engine and map code with London Journey: ../journey/index.html)
   URL options: ?kiosk=1  ?theme=dark|light  ?lines=victoria,central  ?modes=tube,dlr,...  ?view=lat,lon,zoom
   ?auto=1 (TV: overview, tour and departure boards in turn)  ?board=Oxford Circus (TV departure board)  ?station=Oxford Circus (open a station's next trains)  ?tour=1 (follow a different train every minute; T key)  ?refresh=30  ?fps=30  ?app_key=TFLKEY  ?debug=1  ·  Keys: K kiosk, D dark/light, / search
   Old notes from the Journey page follow, unchanged:
   Journeys: Google directions (all transport, anywhere). Live London data: TfL Unified API. Map: Google Maps.
   URL options: ?sim=1 (test mode: drag the blue marker)  ?theme=dark|light  ?app_key=TFLKEY  ?debug=1 */
:root{--bg:#fff;--ink:#141414;--mute:#666;--panel:#fff;--edge:rgba(0,0,0,.12);--soft:#f2f4f7;--acc:#1a73e8;--good:#188038;--bad:#d93025}
body.dark{--bg:#0e0f12;--ink:#f2f2f2;--mute:#9a9a9a;--panel:#17181c;--edge:rgba(255,255,255,.14);--soft:#22242a;--acc:#8ab4f8;--good:#81c995;--bad:#f28b82}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Hanken Grotesk",system-ui,sans-serif;overflow:hidden}
#map{position:fixed!important;inset:0;background:var(--bg)} /* Google sets position:relative inline */
#trains,#lines{position:absolute;left:0;top:0;pointer-events:none;z-index:450}
#lines{z-index:449}
#panel{position:fixed;z-index:1000;top:12px;left:12px;width:360px;max-height:calc(100% - 24px);overflow:auto;
  background:var(--panel);border:1px solid var(--edge);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:14px}
h1{margin:0 0 10px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
h1 .sp{flex:1}
#ttl{overflow:hidden;text-overflow:ellipsis;min-width:0} h1 .icon{padding:6px 7px;flex:none} h1{gap:5px}
form{display:grid;gap:8px}
.field{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:0 10px}
.field label{font-size:12px;color:var(--mute);min-width:34px;white-space:nowrap}
.field input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0;min-width:0;outline:none}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field input[type=time]{min-width:0;width:100%}
button{font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
body.dark button.primary{color:#0e0f12}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.field input:focus-visible{outline:none}
.field:focus-within{box-shadow:0 0 0 2px var(--acc) inset}
.icon{padding:7px 9px;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;line-height:1}
.icon.on{background:var(--soft)}
#options,#chainOut{display:grid;gap:8px;margin-top:12px}
.tabs{display:flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden;margin-bottom:10px}
.tabs button{flex:1;border:0;border-radius:0;padding:8px;font-size:13px}
.tabs button+button{border-left:1px solid var(--edge)}
.tabs button.sel{background:var(--ink);color:var(--bg);font-weight:600}
#chain{display:grid;gap:0}
.cstop{display:flex;gap:6px;align-items:center}
.cstop .field{flex:1}
.cstop .x{padding:6px 9px;color:var(--mute)}
.cmode{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:4px 0 4px 14px;padding:4px 0 4px 12px;border-left:3px dotted var(--edge)}
.cmode button{padding:5px;border-radius:8px;line-height:0}
.cmode button.sel{background:var(--soft);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.cmode .lbl{font-size:12px;color:var(--mute);flex-basis:100%;order:-1;margin:0 0 1px 2px}
.mapmenu{background:var(--soft);border-radius:12px;padding:6px 12px;margin-bottom:10px;display:grid}
.mm-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;cursor:pointer}
.mm-row+.mm-row{border-top:1px solid var(--edge)}
.explore{background:var(--soft);border-radius:12px;padding:10px 12px;margin:8px 0}
.explore .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--mute);margin-bottom:8px}
.explore .crumb button{border:0;background:none;padding:2px 4px;color:var(--acc,#1a73e8);font-size:12.5px;font-weight:600;cursor:pointer}
.explore .crumb .x{margin-left:auto;color:var(--mute)}
.explore .list{display:grid;gap:4px}
.explore .list button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-size:14px;padding:9px 11px;border-radius:9px}
.explore .list button small{color:var(--mute);font-size:12px;white-space:nowrap}
.explore .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good,#188038);margin-right:6px}
.explore .soon{background:#c9a227}
.explore h3{margin:2px 0 6px;font-size:16px}
.explore .opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.explore .opts button{font-size:13px;padding:6px 10px;border-radius:99px}
.explore .opts button[aria-pressed=false]{opacity:.45}
.explore p{margin:6px 0 0;font-size:12.5px;color:var(--mute);line-height:1.4}
.mm-places{padding:8px 0;border-top:1px solid var(--edge)}.mm-places+.mm-row{border-top:1px solid var(--edge)}.mm-places b{display:block;font-size:13px;font-weight:600;margin:2px 0 6px}.mm-places b small{font-weight:400;color:var(--mute)}.mm-places .pl{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.mm-places .pl button{font-size:12.5px;padding:5px 10px}
.mm-row small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.seg2{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden;flex:none}
.seg2 button{border:0;border-radius:0;padding:6px 10px;font-size:13px;background:var(--panel)}
.seg2 button+button{border-left:1px solid var(--edge)}
.seg2 button.sel{background:var(--ink);color:var(--bg);font-weight:600}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:24px;border-radius:12px;background:#c4c7cc;position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch:checked{background:var(--acc)} .switch:checked::after{left:19px}
body.dark .switch{background:#5f6368}
body.dark .switch:checked{background:var(--acc)}
.icon[aria-expanded="true"]{background:var(--soft)}
.mm-modes{display:grid;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:5px 9px 5px 6px;border-radius:99px;border:1px solid var(--edge);background:var(--panel)}
.chip2[aria-pressed="false"]{opacity:.45}
.chip2[aria-pressed="false"] .sym{filter:grayscale(1)}
.chip2:disabled{opacity:.35;cursor:default}
.chip2 small{font-size:11px;color:var(--mute)}
.aclist{list-style:none;margin:4px 0 6px;padding:4px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.aclist li{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer}
.aclist li.on,.aclist li:hover{background:var(--soft)}
.aclist .pin{flex:none;margin-top:2px;color:var(--mute)}
.aclist b{display:block;font-weight:600;font-size:14px}
.aclist small{display:block;color:var(--mute);font-size:12px}
.aclist .gattr{justify-content:flex-end;cursor:default;padding:2px 6px;font-size:11px;color:var(--mute)}
.aclist .gattr:hover{background:none}
.st{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;white-space:nowrap;line-height:1.5}
.st1{background:#fff1c2;color:#7a5200} .st2{background:#ffd9cc;color:#9a2400} .st3{background:#e3e3e3;color:#333}
body.dark .st1{background:#4a3b0f;color:#ffd96b} body.dark .st2{background:#5a1f12;color:#ffb39e} body.dark .st3{background:#3a3a3a;color:#ddd}
.note{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.opt{text-align:left;display:grid;gap:6px;padding:10px 12px}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.opt-top{display:flex;justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pill{font-size:12px;font-weight:600;padding:2px 7px 2px 5px;border-radius:6px;white-space:nowrap;background:var(--soft);
  display:inline-flex;align-items:center;gap:4px;box-shadow:inset 0 -2px 0 var(--c)}
.pill.walk{font-weight:400;box-shadow:none}
.sym{flex:none;vertical-align:-3px}
.li-h .sym{align-self:center}
.tt-h{display:flex;align-items:center;gap:6px;font-size:15px;margin-bottom:2px}
.tt-m{color:var(--mute);font-size:12px}
.tt-you{color:var(--acc);font-weight:600;font-size:12px}
.sep{color:var(--mute);font-size:12px}
.muted{color:var(--mute);font-size:13px}
.warn{color:#b06000;font-size:12px}
body.dark .warn{color:#fdd663}
.bad{color:var(--bad)} .good{color:var(--good)}
.amb-h{font-weight:600;margin-top:4px}
.amb{text-align:left;display:flex;justify-content:space-between;gap:8px}
.amb small{color:var(--mute)}
#eta{display:grid;gap:4px;margin-bottom:10px}
.eta-big{font-size:22px}
.chip{justify-self:start;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft)}
.chip.bad{background:var(--bad);color:#fff} .chip.good{background:var(--good);color:#fff}
body.dark .chip.bad,body.dark .chip.good{color:#111}
#banner{background:#fff4e5;color:#3b2600;border-radius:12px;padding:10px 12px;display:grid;gap:8px;margin-bottom:10px;border:1px solid #f5c26b}
body.dark #banner{background:#3b2a10;color:#ffe2b0;border-color:#7a5a20}
#steps{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:2px}
#steps li{border-left:4px solid var(--c);padding:6px 0 6px 10px;display:grid;gap:2px}
#steps li.done{opacity:.45}
.gmaps{display:inline-block;color:var(--acc);font-weight:600;font-size:14px;margin:0 0 12px;text-decoration:none}
.gmaps:hover{text-decoration:underline}
#steps li.cur{background:var(--soft);border-radius:0 8px 8px 0}
.li-h{display:flex;gap:6px;align-items:baseline}
.li-h span{flex:1;font-weight:600}
.li-h small,.li-d{color:var(--mute);font-size:12.5px}
.li-live{font-size:13px}
#err{color:var(--bad);font-size:12px;margin-top:6px}
#tip{position:fixed;z-index:1001;pointer-events:none;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;font-size:13px;display:none;max-width:250px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none}
#tip div{margin:1px 0}
#simnote{display:none;font-size:12px;background:#e8f0fe;color:#174ea6;border-radius:8px;padding:6px 8px;margin-bottom:8px}
body.sim #simnote{display:block}
body.dark #simnote{background:#1f2a44;color:#c6dafc}
@media (max-width:700px){
  #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:52%;border-radius:16px 16px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
}

@media (min-width:701px){#panel{width:336px}}
#status{font-size:13px;color:var(--mute);margin:-4px 0 10px}
#status b{color:var(--ink)}
.search{position:relative;margin-bottom:10px}
#sres{list-style:none;margin:4px 0 0;padding:4px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
#sres li{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
#sres li.on,#sres li:hover{background:var(--soft)}
#sres li.none{cursor:default;color:var(--mute);font-size:13px}
#sres b{display:block;font-weight:600;font-size:14px}
#sres small{display:block;color:var(--mute);font-size:12px}
.dots{display:flex;gap:2px;flex:none;width:34px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
#station{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.st-h{display:flex;align-items:center;justify-content:space-between;font-size:16px}
.st-h .x{padding:4px 8px;font-size:12px}
.st-lines{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.dep-h{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:10px 0 2px}
.st-warn{font-size:12px;line-height:1.35;padding:5px 8px;border-radius:8px;margin:4px 0}.st-warn b{font-weight:700}
.deps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.deps li{display:flex;align-items:center;gap:8px;font-size:13.5px}
.deps .sw{width:4px;align-self:stretch;border-radius:2px;flex:none}
.deps .to{flex:1;min-width:0}
.deps small{display:block;color:var(--mute);font-size:11.5px}
.deps b{white-space:nowrap;font-variant-numeric:tabular-nums}
#mModes{margin:0 0 8px}
#legend{display:grid;gap:0}
body.abroad #mModes [data-mode=rail]{display:none}
body.away #legend, body.away #lgAll, body.away #sbox, body.away #mModes [data-mode=tube], body.away #mModes [data-mode=overground], body.away #mModes [data-mode=elizabeth], body.away #mModes [data-mode=dlr], body.away #mModes [data-mode=tram]{display:none} /* London-only parts, hidden elsewhere */
.lgall{display:flex;justify-content:flex-end;gap:14px;margin:2px 0 4px}.lgall button{background:none;border:0;padding:4px 2px;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer}.lgall button:hover{color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;padding:4px 2px;border:0;background:none;border-radius:6px;font-size:14px;text-align:left;width:100%}
.row:hover{background:var(--soft)}
.row .sw{width:22px;height:6px;border-radius:3px;flex:none}
.row .nm{flex:1}
.row .st{margin-left:4px}
.sb{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--soft);border:0;margin-bottom:8px;text-align:left}
.sb span{color:var(--acc);font-size:12px}
.sb.ok{color:var(--good);font-weight:600}
.sbl{display:grid;gap:8px;margin:-2px 0 10px;max-height:260px;overflow:auto}
.sbi{background:var(--soft);border-radius:10px;padding:8px 10px}
.sbh{display:flex;align-items:center;gap:6px;font-size:13px}
.sbh .sw{width:14px;height:5px;border-radius:3px}
.sbi p{margin:4px 0 0;font-size:12.5px;color:var(--mute)}
.row .n{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.row.off{opacity:.38}
#clock{position:fixed;right:16px;bottom:30px;z-index:1000;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 0 8px var(--bg);display:none}
body.kiosk #panel{display:none} body.kiosk #clock{display:block} body.boardon #clock{display:none!important}
body.kiosk #map{bottom:0!important}
#follow{background:var(--soft);border-radius:12px;padding:9px 11px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:13.5px}
#follow .sw{width:6px;align-self:stretch;border-radius:3px;flex:none}
#follow .ft{flex:1;min-width:0}
#follow small{display:block;color:var(--mute);font-size:12px}
#follow button{font-size:12.5px;padding:5px 9px;flex:none}
#tourcap{position:fixed;left:24px;bottom:30px;z-index:1000;background:rgba(10,10,10,.82);color:#fff;border-radius:12px;padding:12px 16px;font-size:20px;max-width:60vw}
#tourcap b{display:block;font-size:26px}
#tourcap small{display:block;font-size:16px;opacity:.75}
/* departure board (TV): station-style next trains, beside the map */
#board{position:fixed;top:24px;right:24px;z-index:1000;width:min(560px,44vw);max-height:calc(100% - 120px);overflow:auto;
  background:#0b0b0b;color:#ffb000;border-radius:14px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
#board h2{margin:0 0 4px;font-size:30px;color:#fff;font-weight:800;display:flex;justify-content:space-between;gap:12px}
#board h2 small{font-size:22px;color:#ffb000;font-weight:600}
#board .bl{display:flex;gap:6px;margin:0 0 12px}
#board .bl i{height:6px;flex:1;border-radius:3px}
#board ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#board li{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;font-size:24px;line-height:1.15}
#board li .c{align-self:stretch;border-radius:3px}
#board li .d{color:#ffcf4d;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#board li .d small{display:block;font-size:16px;color:#c98a00}
#board li b{font-size:26px;color:#fff}
#board .msg{font-size:18px;color:#ffcf4d;border-top:1px solid #333;margin-top:14px;padding-top:10px}
@media (max-width:700px){#board{left:12px;right:12px;width:auto;top:12px;padding:14px;max-height:calc(100% - 24px);z-index:1100}#board h2{font-size:22px}#board li{font-size:18px}#board li b{font-size:19px}}
.st-actions{display:flex;gap:6px;margin:6px 0 2px}
.st-actions button{font-size:12.5px;padding:5px 10px}
.st-actions a.btn{font-size:12.5px;padding:5px 10px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1><span id="ttl">London live trains</span> <span class="sp"></span>
    <button id="bPlaces" class="icon" title="Explore cities" aria-label="Explore cities around the world" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button id="bMap" class="icon" title="Map style" aria-label="Map style" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zm-9 9l9 5 9-5M3 16l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button id="bFit" class="icon" title="Re-centre" aria-label="Re-centre the map">⌖</button>
    <button id="bKiosk" class="icon" title="Full-screen TV mode (K)" aria-label="Full-screen TV mode">⛶</button>
    <button id="bTheme" class="icon" title="Dark / light (D)" aria-label="Switch dark or light map">🌓</button>
  </h1>
  <div id="status">Loading lines…</div>
  <div id="explore" class="explore" hidden></div>
  <div class="search">
    <div class="field"><label for="q">Find</label><input id="q" placeholder="Search a station or line (e.g. 172, Victoria)" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sres" enterkeyhint="search"></div>
    <ul id="sres" role="listbox" hidden></ul>
  </div>
  <div id="station" hidden></div>
  <div id="follow" hidden></div>
  <div id="mapMenu" class="mapmenu" hidden>
    <div class="mm-row"><span>Map style</span>
      <div class="seg2" role="group" aria-label="Map style"><button data-ms="google">Google Maps</button><button data-ms="original">Original</button></div></div>
    <label class="mm-row"><span>Hide places &amp; labels<small>Shops, landmarks, stations and area names. Street names stay.</small></span><input type="checkbox" id="mQuiet" class="switch"></label>

let STATIONS = null;
function stationIndex(){
  const by = new Map();
  for(const l of ACTIVE){ if(l.mode === 'bus' || !l.stops) continue;
    for(const [id, s] of Object.entries(l.stops)){
      const name = s.n.replace(/\s*\((?:[^)]*line|H&C|Circle Line|[^)]*Underground)[^)]*\)\s*/i, ' ').replace(/-Underground$/i, '').replace(/\s+/g, ' ').trim();
      const key = name.toLowerCase().replace(/^london /, '').replace(/ \(london\)$/, '').replace(/['’.]/g, '').replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim(); // "London Victoria" = "Victoria"
      let st = by.get(key);
      if(st && dist(st.p, s.p) > 600) st = by.get(key + '#' + id) || null; // same name, different place
      if(!st){ st = {name, p:s.p, lines:new Set(), ids:new Set(), key}; by.set(by.has(key) ? key + '#' + id : key, st); }
      st.lines.add(l.id); st.ids.add(id);

  }

}

function searchStations(text){

  const head0 = () => `<div class="st-h"><b>${esc(st.name)}</b><button type="button" class="x" id="stClose" aria-label="Close">✕</button></div>
    <div class="st-actions"><button type="button" id="stBoard">Show as TV board</button><a class="btn" id="stPlan" href="journey/?to=${encodeURIComponent(st.name)}&ll=${st.p[0].toFixed(5)},${st.p[1].toFixed(5)}">Plan a trip here</a></div>
    <div class="st-lines">${[...st.lines].map(id => `<span class="pill" style="--c:${BY[id].colour}">${symbol(BY[id].mode==='tube'?'tube':BY[id].mode, BY[id].colour, 14)} ${esc(BY[id].name)}</span>`).join('')}</div>`
    + [...st.lines].map(id => { const x = lineStatus(id); if(!x || !x.lv) return ''; const why = (x.reasons[0] || '').replace(/\s*(Good service|Valid tickets).*$/i, '');
      return `<div class="st-warn st${x.lv}" title="${esc(why)}"><b>${esc(BY[id].name)}: ${esc(x.text)}</b>${why ? ' · ' + esc(why.length > 90 ? why.slice(0, 90).replace(/\s+\S*$/, '') + '…' : why) : ''}</div>`; }).join(''); // problems on this station's lines (rebuilt on each refresh: status may arrive later)
  let head = head0();
  box.innerHTML = head + '<div class="muted">Loading next trains…</div>';
  const CAT = {tube:'Tube', overground:'Overground', elizabeth:'Elizabeth line', dlr:'DLR', tram:'Trams', bus:'Buses', rail:'National Rail', 'elizabeth-line':'Elizabeth line', 'national-rail':'National Rail'};
  let busStops = null; // bus stops within ~250 m, found once
  const load = async () => {
    head = head0();
    if(!busStops) busStops = get(`/StopPoint?lat=${st.p[0]}&lon=${st.p[1]}&radius=250&stopTypes=NaptanPublicBusCoachTram&modes=bus`).then(r => (r.stopPoints || []).slice(0, 6).map(x => x.naptanId)).catch(() => []);
    const bs = await busStops;
    const all = (await Promise.all([...[...st.ids].slice(0, 5).map(id => /^[A-Z]{3}$/.test(id) ? railArrivals(id) : get(`/StopPoint/${id}/Arrivals`).catch(() => [])),
      ...bs.map(id => get(`/StopPoint/${id}/Arrivals`).catch(() => []))])).flat()
      .filter(a => st.lines.has(a.lineId) || a.rail || a.modeName === 'bus');
    const seen = new Set(), now = Date.now(), rows = all.sort((a, b) => a.timeToStation - b.timeToStation)
      .filter(a => { const k = a.vehicleId + a.lineId + a.platformName; if(seen.has(k)) return false; seen.add(k); return true; })
      .map(a => { const l = BY[a.lineId], bus = !l && a.modeName === 'bus' || l?.mode === 'bus', m = Math.round(a.timeToStation/60), col = l ? ink(l.colour) : '#DC241F';
        const name = l ? l.name : a.lineName || a.lineId;
        return {when:now + a.timeToStation*1000, cat:bus ? 'Buses' : CAT[l?.mode] || CAT[a.modeName] || 'Trains',
          html:`<li><span class="sw" style="background:${col}"></span><span class="to">${esc(cleanName(a.towards || a.destinationName || '') || name)}<small>${esc(bus ? 'Bus ' + name + (a.stationName ? ' · ' + a.stationName : '') : name)}${a.platformName && !bus ? ' · ' + esc(a.platformName) : ''}</small></span><b>${m < 1 ? 'due' : m + ' min'}</b></li>`}; });
    if(box.hidden) return;
    box.innerHTML = head + (rows.length ? depGroups(rows) : '<div class="muted">No departures listed right now.</div>');
  };
  load(); focusTimer = setInterval(load, 30000); focusLoad = load;
}
$('station').addEventListener('click', e => {
  if(e.target.closest('#stClose')){ clearFocus(); $('q').value = ''; setStationUrl(null); }
  if(e.target.closest('#stBoard') && FOCUS_ST){ openBoard(FOCUS_ST); }
});
// ---------- departure board ----------
let FOCUS_ST = null, boardTimer = 0, BOARD_ST = null;
function findStation(name){
  const r = searchStations(name); return r[0] || null;
}
const boardCol = c => c === '#000000' ? '#d9d9d9' : c; // the board is black: keep the Northern visible
async function openBoard(st){
  BOARD_ST = st; clearInterval(boardTimer); $('board').hidden = false; document.body.classList.add('boardon');
  try{ const u = new URL(location); u.searchParams.set('board', st.name); history.replaceState(null, '', u); }catch(e){}
  const draw = async () => {
    const all = (await Promise.all([...st.ids].slice(0, 5).map(id => /^[A-Z]{3}$/.test(id) ? railArrivals(id) : get(`/StopPoint/${id}/Arrivals`).catch(() => [])))).flat().filter(a => st.lines.has(a.lineId) || a.rail);
    const seen = new Set();
    const rows = all.sort((a, b) => a.timeToStation - b.timeToStation)
      .filter(a => { const k = a.vehicleId + a.lineId + a.platformName; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0, 9);
    const bad = [...st.lines].map(id => [BY[id], lineStatus(id)]).filter(([, s]) => s && s.lv);
    $('board').innerHTML = `<h2><span>${esc(st.name)}</span><small id="bclock">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</small></h2>
      <div class="bl">${[...st.lines].map(id => `<i style="background:${boardCol(BY[id].colour)}"></i>`).join('')}</div>
      ${rows.length ? `<ol>${rows.map(a => { const l = BY[a.lineId], m = Math.round(a.timeToStation/60);
        return `<li><span class="c" style="background:${boardCol(l.colour)}"></span><span class="d">${esc(cleanName(a.destinationName || a.towards || l.name))}<small>${esc(l.name)}${a.platformName ? ' · ' + esc(a.platformName.replace(/^.*- /, '')) : ''}</small></span><b>${m < 1 ? 'Due' : m + ' min'}</b></li>`; }).join('')}</ol>` : '<div class="msg">No trains listed right now</div>'}
      ${bad.map(([l, s]) => `<div class="msg">⚠ ${esc(l.name)}: ${esc(s.text)}</div>`).join('')}`;
  };
  await draw(); boardTimer = setInterval(draw, 20000);
}
function closeBoard(){ clearInterval(boardTimer); BOARD_ST = null; $('board').hidden = true; document.body.classList.remove('boardon');
  try{ const u = new URL(location); u.searchParams.delete('board'); history.replaceState(null, '', u); }catch(e){} }
$('board').addEventListener('click', closeBoard);

// ---------- follow a train; tour mode for the TV ----------
const FW = {t:null, last:0, tour:Q.get('tour') === '1', tourAt:0};
const trainText = t => { const l = BY[t.line];
  return {line:l.name + (['tube','elizabeth','overground'].includes(l.mode) ? ' line' : ''), to:t.towards ? 'to ' + cleanName(t.towards) : '', next:l.stops[t.cur || t.next] ? 'next: ' + l.stops[t.cur || t.next].n : '', colour:l.colour}; };
function renderFollow(){
  const el = $('follow'), t = FW.t;
  if(!t || !trains.has(t.key)){ el.hidden = true; return; }
  const x = trainText(t); el.hidden = false;
  el.innerHTML = `<span class="sw" style="background:${ink(x.colour)}"></span><span class="ft"><b>Following ${esc(x.line)}</b> ${esc(x.to)}<small>${esc(x.next)}</small></span><button type="button" id="fwStop">Stop</button>`;
  if(FW.tour){ const c = $('tourcap'); c.hidden = false; c.innerHTML = `<b style="color:${boardCol ? boardCol(x.colour) : x.colour}">${esc(x.line)}</b>${esc(x.to)}<small>${esc(x.next)}</small>`; }
}
function follow(t, zoom = 14){ HL.clear(); if(t) HL.add(t.key); FW.t = t; if(t && t.d){ map.setZoom(Math.max(map.getZoom(), zoom)); map.panTo(LL(t.d)); } renderFollow(); }
function stopFollow(){ HL.clear(); FW.t = null; FW.tour = false; $('tourcap').hidden = true; renderFollow(); }
$('follow').addEventListener('click', e => { if(e.target.closest('#fwStop')) stopFollow(); });
map.addListener('click', ev => { if(!ev.pixel) return; const {x, y} = ev.pixel, coarse = matchMedia('(pointer:coarse)').matches;
  if(document.body.classList.contains('away')){ const cs = cityStationAt(x, y); if(cs) return openCityStation(cs); return; } // abroad: the city's stations
  const onDot = stationAt(x, y, coarse ? 12 : 8); if(onDot) return goStation(onDot); // right on a dot: the station, even with a train waiting there
  const t = nearest(x, y); if(t) return follow(t, map.getZoom());
  const st = stationAt(x, y); if(st) goStation(st); });
// a station dot under the finger (dots show from zoom 13): open its next trains
function stationAt(x, y, r){
  if(map.getZoom() < 13) return null;
  if(!STATIONS || STATIONS.length < 50) STATIONS = stationIndex();
  let best = null, bd = r || (matchMedia('(pointer:coarse)').matches ? 22 : 14);
  for(const st of STATIONS){ if(![...st.lines].some(id => BY[id] && BY[id].on !== false && lineStyle(BY[id]).opacity > 0)) continue;
    const q = scr(st.p), d = Math.hypot(q.x - x, q.y - y); if(d < bd){ bd = d; best = st; } }
  return best;
}
map.addListener('dragstart', () => { if(FW.t && !FW.tour) stopFollow(); });
// keep the followed train in view (gently), and in tour mode hop to a new train every minute
setInterval(() => {
  if(FW.tour && (!FW.t || !trains.has(FW.t.key) || Date.now() - FW.tourAt > 60000)){
    const vis = [...trains.values()].filter(t => t.d && BY[t.line] && shown(BY[t.line]) && BY[t.line].on !== false && t.prev && (!FW.t || t.line !== FW.t.line));
    if(vis.length){ FW.tourAt = Date.now(); follow(vis[Math.floor(Math.random()*vis.length)], 14); }
  }
  if(FW.t && FW.t.d){ const c = map.getCenter(), d = dist([c.lat(), c.lng()], FW.t.d); if(d > 25) map.panTo(LL(FW.t.d)); renderFollow(); }
}, 1000);
if(FW.tour) setTimeout(() => { FW.tourAt = 0; }, 15000);

// ---------- TV auto mode (?auto=1): overview → tour → departure board, on repeat ----------
const AUTO = {on:Q.get('auto') === '1', step:-1, at:0, boards:(Q.get('board') ? [Q.get('board')] : ["King's Cross", 'Waterloo', 'Oxford Circus', 'Stratford', 'London Bridge', 'Victoria'])};
const AUTO_STEPS = [['overview', 120], ['tour', 180], ['board', 60]];
function autoNext(){
  AUTO.step = (AUTO.step + 1) % AUTO_STEPS.length; AUTO.at = Date.now();
  const [kind] = AUTO_STEPS[AUTO.step];
  stopFollow(); closeBoard();
  if(kind === 'overview'){ map.panTo(LL(HOME[0])); map.setZoom(Math.round(HOME[1])); }
  else if(kind === 'tour'){ FW.tour = true; FW.tourAt = 0; }
  else { const name = AUTO.boards[AUTO.n = ((AUTO.n ?? -1) + 1) % AUTO.boards.length], st = findStation(name);
    if(st){ openBoard(st); map.panTo(LL(st.p)); map.setZoom(14); } else autoNext(); }
}
if(AUTO.on){ document.body.classList.add('kiosk');
  setInterval(() => { if(!ACTIVE.every(l => l.layer)) return; // wait until all lines are loaded
    if(AUTO.step < 0 || Date.now() - AUTO.at > AUTO_STEPS[AUTO.step][1]*1000) autoNext(); }, 2000); }

// ---------- kiosk, clock, re-centre, keys ----------
if(Q.get('kiosk') === '1') document.body.classList.add('kiosk');
$('bKiosk').onclick = () => document.body.classList.toggle('kiosk');
$('bFit').onclick = () => { map.panTo(LL(HOME[0])); map.setZoom(Math.round(HOME[1])); };
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'k' || e.key === 'K') document.body.classList.toggle('kiosk');
  if(e.key === 'd' || e.key === 'D') toggleDark();
  if(e.key === '/'){ e.preventDefault(); $('q').focus(); }
  if(e.key === 't' || e.key === 'T'){ if(FW.tour) stopFollow(); else { FW.tour = true; FW.tourAt = 0; } }
  if(e.key === 'Escape' && FW.t) stopFollow();
});
const tick = () => { $('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); };
tick(); setInterval(tick, 1000);
map.addListener('dragstart', () => { $('tip').style.display = 'none'; hover = null; });
map.addListener('zoom_changed', () => { $('tip').style.display = 'none'; hover = null; });
renderModeChips(); renderLegend(); syncMapMenu();
if(DEBUG) window.LLT = {AUTO, autoNext: () => autoNext(), trains, ACTIVE, BY, placeTrain, segTime, refresh, map, draw, goStation, searchStations, scr, stationAt, GPS, gpsPos, BIKES, SHARE, cityData: () => cityData()};

// ---------- boot ----------
(async () => {
  let ok = 0;
  const queue = ACTIVE.slice();
  await Promise.all([0,1,2,3,4].map(async () => { // first visit only: line shapes are cached for a week
    for(let l; (l = queue.shift()); ){
      const cached = !!store.get('seq2:'+l.id);
      try{ await loadLine(l); ok++; $('status').textContent = `Loading lines… ${ok}/${ACTIVE.length}`; }
      catch(e){ $('err').textContent = 'Could not load ' + l.name + ': ' + e.message; }
      if(!cached) await sleep(80);
    }
  }));
  STATIONS = null; renderModeChips(); renderLegend();
  if(Q.get('board')){ const st = findStation(Q.get('board')); if(st){ openBoard(st); map.panTo(LL(st.p)); map.setZoom(14); } }
  else if(Q.get('station')){ const st = findStation(Q.get('station')); if(st) goStation(st); } // bookmarkable: ?station=Oxford Circus
  for(;;){
    let good = false;
    try{ good = await refresh(); }catch(e){ $('err').textContent = 'Error: ' + e.message; console.error(e); }
    await sleep(good ? REFRESH : Math.min(REFRESH*8, REFRESH*2**Math.min(3, failStreak)));
  }
})();
})();

</script>
</body>
