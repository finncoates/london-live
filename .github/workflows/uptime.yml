# Every 30 minutes: the live site, the relay and one timetable tile answer. A failed run emails the repository owner.
name: uptime
on:
  schedule: [{cron: '*/30 * * * *'}]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site
        run: curl -fsS -m 30 -o /dev/null https://finncoates.github.io/london-live/
      - name: Relay health
        run: curl -fsS -m 30 https://london-rail.londonlivemap.workers.dev/health | grep -q '"ok":true'
      - name: Timetable tile (Paris)
        run: curl -fsS -m 40 -H 'Origin: https://finncoates.github.io' 'https://london-rail.londonlivemap.workers.dev/tt?la=48.75&lo=2.25&s=0.125&modes=rail,tram&z=14' | grep -q '"vehicles"'
