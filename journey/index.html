<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>London Journey</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journey">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* London Journey — plan a London trip and get re-routed live when things go wrong.
   Journeys: Google directions (all transport, anywhere). Live London data: TfL Unified API. Map: Google Maps.
   URL options: ?sim=1 (test mode: drag the blue marker)  ?theme=dark|light  ?app_key=TFLKEY  ?debug=1 */
:root{--bg:#fff;--ink:#141414;--mute:#666;--panel:#fff;--edge:rgba(0,0,0,.12);--soft:#f2f4f7;--acc:#1a73e8;--good:#188038;--bad:#d93025}
body.dark{--bg:#0e0f12;--ink:#f2f2f2;--mute:#9a9a9a;--panel:#17181c;--edge:rgba(255,255,255,.14);--soft:#22242a;--acc:#8ab4f8;--good:#81c995;--bad:#f28b82}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Hanken Grotesk",system-ui,sans-serif;overflow:hidden}
#map{position:fixed!important;inset:0;background:var(--bg)} /* Google sets position:relative inline */
#trains,#lines{position:absolute;left:0;top:0;pointer-events:none;z-index:450}
#lines{z-index:449}
#panel{position:fixed;z-index:1000;top:12px;left:12px;width:360px;max-height:calc(100% - 24px);overflow:auto;
  background:var(--panel);border:1px solid var(--edge);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:14px}
h1{margin:0 0 10px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
h1 .sp{flex:1}
form{display:grid;gap:8px}
.field{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:0 10px}
.field label{font-size:12px;color:var(--mute);min-width:34px;white-space:nowrap}
.field input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0;min-width:0;outline:none}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field input[type=time]{min-width:0;width:100%}
button{font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
body.dark button.primary{color:#0e0f12}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.field input:focus-visible{outline:none}
.field:focus-within{box-shadow:0 0 0 2px var(--acc) inset}
.icon{padding:7px 9px;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;line-height:1}
.icon.on{background:var(--soft)}
#options,#chainOut{display:grid;gap:8px;margin-top:12px}
.tabs{display:flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden;margin-bottom:10px}
.tabs button{flex:1;border:0;border-radius:0;padding:8px;font-size:13px}
.tabs button+button{border-left:1px solid var(--edge)}
.tabs button.sel{background:var(--ink);color:var(--bg);font-weight:600}
#chain{display:grid;gap:0}
.cstop{display:flex;gap:6px;align-items:center}
.cstop .field{flex:1}
.cstop .x{padding:6px 9px;color:var(--mute)}
.cmode{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:4px 0 4px 14px;padding:4px 0 4px 12px;border-left:3px dotted var(--edge)}
.cmode button{padding:5px;border-radius:8px;line-height:0}
.cmode button.sel{background:var(--soft);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.cmode .lbl{font-size:12px;color:var(--mute);flex-basis:100%;order:-1;margin:0 0 1px 2px}
.mapmenu{background:var(--soft);border-radius:12px;padding:6px 12px;margin-bottom:10px;display:grid}
.mm-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;cursor:pointer}
.mm-row+.mm-row{border-top:1px solid var(--edge)}
.mm-row small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.seg2{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden;flex:none}
.seg2 button{border:0;border-radius:0;padding:6px 10px;font-size:13px;background:var(--panel)}
.seg2 button+button{border-left:1px solid var(--edge)}
.seg2 button.sel{background:var(--ink);color:var(--bg);font-weight:600}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:24px;border-radius:12px;background:#c4c7cc;position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch:checked{background:var(--acc)} .switch:checked::after{left:19px}
body.dark .switch{background:#5f6368}
body.dark .switch:checked{background:var(--acc)}
.icon[aria-expanded="true"]{background:var(--soft)}
.mm-modes{display:grid;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:5px 9px 5px 6px;border-radius:99px;border:1px solid var(--edge);background:var(--panel)}
.chip2[aria-pressed="false"]{opacity:.45}
.chip2[aria-pressed="false"] .sym{filter:grayscale(1)}
.chip2:disabled{opacity:.35;cursor:default}
.chip2 small{font-size:11px;color:var(--mute)}
.aclist{list-style:none;margin:4px 0 6px;padding:4px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.aclist li{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer}
.aclist li.on,.aclist li:hover{background:var(--soft)}
.aclist .pin{flex:none;margin-top:2px;color:var(--mute)}
.aclist b{display:block;font-weight:600;font-size:14px}
.aclist small{display:block;color:var(--mute);font-size:12px}
.aclist .gattr{justify-content:flex-end;cursor:default;padding:2px 6px;font-size:11px;color:var(--mute)}
.aclist .gattr:hover{background:none}
.st{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;white-space:nowrap;line-height:1.5}
.st1{background:#fff1c2;color:#7a5200} .st2{background:#ffd9cc;color:#9a2400} .st3{background:#e3e3e3;color:#333}
body.dark .st1{background:#4a3b0f;color:#ffd96b} body.dark .st2{background:#5a1f12;color:#ffb39e} body.dark .st3{background:#3a3a3a;color:#ddd}
.sb{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--soft);border:0;margin-top:12px;text-align:left}
.sb span{color:var(--acc);font-size:12px}
.sb.ok{color:var(--good);font-weight:600}
.sbl{display:grid;gap:8px;margin-top:8px}
.sbi{background:var(--soft);border-radius:10px;padding:8px 10px}
.sbh{display:flex;align-items:center;gap:6px;font-size:13px}
.sbh .sw{width:14px;height:5px;border-radius:3px;display:inline-block}
.sbi p{margin:4px 0 0;font-size:12.5px;color:var(--mute)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qc{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:6px 10px;border-radius:99px;border:1px solid var(--edge);background:var(--panel);max-width:100%}
.qc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.qc.add{color:var(--mute);border-style:dashed}
.qc .x{margin-left:2px;color:var(--mute);font-size:12px}
.qc.edit{color:var(--acc);border-color:transparent;background:none}
.savebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin:2px 0 4px}
.savebar button{font-size:12.5px;padding:5px 9px;border-radius:99px}
.savebar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.aclist .ic{flex:none;width:16px;text-align:center;font-size:14px;margin-top:1px}
.nb-h{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.nb-h b{font-size:15px} .nb-h button{font-size:12.5px;color:var(--acc);background:none;border:0;padding:0;cursor:pointer}
.card{background:var(--soft);border-radius:12px;padding:9px 11px;margin-bottom:8px}
.card-h{display:flex;align-items:center;gap:8px;cursor:pointer}
.card-h .nm{font-weight:700;font-size:14.5px;flex:1;min-width:0}
.card-h small{color:var(--mute);font-size:12px;white-space:nowrap}
.card .dots{display:flex;gap:2px} .card .dots i{width:8px;height:8px;border-radius:50%;display:block}
.stopl{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:6px;background:#DC241F;color:#fff;font-size:12px;font-weight:700}
.deps2{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.deps2 li{display:flex;align-items:center;gap:8px;font-size:13.5px}
.deps2 .ln{flex:none;min-width:34px;font-weight:700;font-size:12px;padding:1px 6px;border-radius:5px;color:#fff;text-align:center}
.deps2 .to{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deps2 .to small{color:var(--mute);font-size:11.5px;margin-left:4px}
.deps2 b{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px;flex:none}
.deps2 .to{flex:1 1 0}
.nb-more{font-size:12px;color:var(--acc);background:none;border:0;padding:0;margin-top:4px}
.alert{background:var(--acc);color:#fff;border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:15px;display:flex;gap:10px;align-items:center}
.alert b{font-size:17px;display:block}
.alert .ai{font-size:24px;line-height:1}
body.dark .alert{color:#0e0f12}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2000;background:#202124;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fare{color:var(--mute);font-size:12.5px}
.prefs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.prefs::-webkit-scrollbar{display:none}
.prefs button{flex:none;font-size:12.5px;padding:5px 10px;border-radius:99px}
.prefs button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.wm{border:0;background:none;padding:0 6px 0 0;font-size:12px;color:var(--acc);font-weight:600;white-space:nowrap;min-width:44px;text-align:left}
.note{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.opt{text-align:left;display:grid;gap:6px;padding:10px 12px}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.opt-top{display:flex;justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pill{font-size:12px;font-weight:600;padding:2px 7px 2px 5px;border-radius:6px;white-space:nowrap;background:var(--soft);
  display:inline-flex;align-items:center;gap:4px;box-shadow:inset 0 -2px 0 var(--c)}
.pill.walk{font-weight:400;box-shadow:none}
.sym{flex:none;vertical-align:-3px}
.li-h .sym{align-self:center}
.tt-h{display:flex;align-items:center;gap:6px;font-size:15px;margin-bottom:2px}
.tt-m{color:var(--mute);font-size:12px}
.tt-you{color:var(--acc);font-weight:600;font-size:12px}
.sep{color:var(--mute);font-size:12px}
.muted{color:var(--mute);font-size:13px}
.warn{color:#b06000;font-size:12px}
body.dark .warn{color:#fdd663}
.bad{color:var(--bad)} .good{color:var(--good)}
.amb-h{font-weight:600;margin-top:4px}
.amb{text-align:left;display:flex;justify-content:space-between;gap:8px}
.amb small{color:var(--mute)}
#eta{display:grid;gap:4px;margin-bottom:10px}
.eta-big{font-size:22px}
.chip{justify-self:start;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft)}
.chip.bad{background:var(--bad);color:#fff} .chip.good{background:var(--good);color:#fff}
body.dark .chip.bad,body.dark .chip.good{color:#111}
#banner{background:#fff4e5;color:#3b2600;border-radius:12px;padding:10px 12px;display:grid;gap:8px;margin-bottom:10px;border:1px solid #f5c26b}
body.dark #banner{background:#3b2a10;color:#ffe2b0;border-color:#7a5a20}
#steps{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:2px}
#steps li{border-left:4px solid var(--c);padding:6px 0 6px 10px;display:grid;gap:2px}
#steps li.done{opacity:.45}
.gmaps{display:inline-block;color:var(--acc);font-weight:600;font-size:14px;margin:0 0 12px;text-decoration:none}
.gmaps:hover{text-decoration:underline}
#steps li.cur{background:var(--soft);border-radius:0 8px 8px 0}
.li-h{display:flex;gap:6px;align-items:baseline}
.li-h span{flex:1;font-weight:600}
.li-h small,.li-d{color:var(--mute);font-size:12.5px}
.li-live{font-size:13px}
#err{color:var(--bad);font-size:12px;margin-top:6px}
#tip{position:fixed;z-index:1001;pointer-events:none;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;font-size:13px;display:none;max-width:250px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none}
#tip div{margin:1px 0}
#simnote{display:none;font-size:12px;background:#e8f0fe;color:#174ea6;border-radius:8px;padding:6px 8px;margin-bottom:8px}
body.sim #simnote{display:block}
body.dark #simnote{background:#1f2a44;color:#c6dafc}
@media (max-width:700px){
  #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:52%;border-radius:16px 16px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>London Journey <span class="sp"></span>
    <button id="bTrains" class="icon" title="Show all live trains" aria-label="Show all live trains"><span id="tsym"></span> <span id="tcount"></span></button>
    <button id="bMap" class="icon" title="Map style" aria-label="Map style" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zm-9 9l9 5 9-5M3 16l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button id="bLocate" class="icon" title="Show my location" aria-label="Show my location">◎</button>
    <button id="bTheme" class="icon" title="Dark / light" aria-label="Switch dark or light map">🌓</button>
  </h1>
  <div id="mapMenu" class="mapmenu" hidden>
    <div class="mm-row"><span>Map style</span>
      <div class="seg2" role="group" aria-label="Map style"><button data-ms="google">Google Maps</button><button data-ms="original">Original</button></div></div>
    <label class="mm-row"><span>Hide places &amp; labels<small>Shops, landmarks, stations and area names. Street names stay.</small></span><input type="checkbox" id="mQuiet" class="switch"></label>
    <label class="mm-row"><span>Dark map</span><input type="checkbox" id="mDark" class="switch"></label>
    <label class="mm-row"><span>Show trains<small>The moving train shapes. The lines stay.</small></span><input type="checkbox" id="mIcons" class="switch"></label>
    <div class="mm-row mm-modes"><span>Live trains on the map</span><div class="chips" id="mModes"></div></div>
  </div>
  <div id="simnote">Test mode: drag the blue pin to pretend you're moving.</div>
  <div class="tabs" id="tabs" role="tablist"><button data-t="search" class="sel" role="tab">Quick route</button><button data-t="build" role="tab">Build my route</button></div>
  <section class="view" data-view="build" hidden>
    <div id="chain"></div>
    <div class="row2" style="margin-top:8px">
      <button type="button" id="bAddStop">+ Add stop</button>
      <div class="field" style="flex:1"><label for="whenB">Leave</label><input id="whenB" type="time" title="Leave at (empty = now)"></div>
      <button type="button" id="bPlanChain" class="primary">Plan</button>
    </div>
    <div id="chainOut"></div>
  </section>
  <section class="view" data-view="search">
    <form id="fSearch" autocomplete="off">
      <div class="field"><label for="from">From</label><input id="from" placeholder="My location" role="combobox" aria-autocomplete="list" aria-expanded="false"></div>
      <div class="field"><label for="to">To</label><input id="to" placeholder="Place, station or postcode" enterkeyhint="search" role="combobox" aria-autocomplete="list" aria-expanded="false"></div>
      <div class="row2">
        <div class="field" style="flex:1"><button type="button" id="whenMode" class="wm" title="Switch between leave at and arrive by">Leave</button><input id="when" type="time" title="Time (empty = now)" aria-label="Time"></div>
        <button type="button" id="bSwap" title="Swap from and to" aria-label="Swap from and to">⇅</button>
        <button type="submit" class="primary">Go</button>
      </div>
    </form>
    <div class="prefs" id="prefs" role="group" aria-label="Route preference">
      <button type="button" data-pref="fastest">Fastest</button><button type="button" data-pref="fewer">Fewer changes</button><button type="button" data-pref="walk">Less walking</button><button type="button" data-pref="stepfree">♿ Step-free</button>
    </div>
    <div id="quick" class="quick"></div>
    <div id="options"></div>
    <div id="sbox"></div>
    <div id="nearby"></div>
  </section>
  <section class="view" data-view="active" hidden>
    <div id="eta"></div>
    <div id="alert" class="alert" hidden role="alert"></div>
    <div id="note" class="note" hidden></div>
    <div id="banner" hidden></div>
    <ol id="steps"></ol>
    <a id="gmaps" class="gmaps" target="_blank" rel="noopener">Open in Google Maps ↗</a>
    <div class="row2"><button id="bReplan">Check for a better route</button><button id="bShare">Share ETA</button><button id="bEnd">End</button></div>
  </section>
  <div id="err"></div>
</div>
<div id="tip"></div>
<script>
(async () => {
const Q = new URLSearchParams(location.search);
const API = 'https://api.tfl.gov.uk';
const KEY = Q.get('app_key') ? 'app_key=' + encodeURIComponent(Q.get('app_key')) : '';
const REFRESH = Math.max(15, +(Q.get('refresh') || 30)) * 1000;
const FPS = Math.min(60, Math.max(5, +(Q.get('fps') || 30)));
const DEBUG = Q.get('debug') === '1';
const VIEW = (Q.get('view') || '').split(',').map(Number);
const HOME = VIEW.length === 3 && VIEW.every(isFinite) ? [[VIEW[0], VIEW[1]], VIEW[2]] : [[51.512, -0.11], 11.5];

// Line catalogue: TfL line id -> name, colour, mode.
// Colours: TfL Colour Standard, Issue 11 (Aug 2026), RGB values for screens.
const LINES = [
  ['bakerloo','Bakerloo','#B26300','tube'],
  ['central','Central','#DC241F','tube'],
  ['circle','Circle','#FFC80A','tube'],
  ['district','District','#007D32','tube'],
  ['hammersmith-city','Hammersmith & City','#F589A6','tube'],
  ['jubilee','Jubilee','#838D93','tube'],
  ['metropolitan','Metropolitan','#9B0058','tube'],
  ['northern','Northern','#000000','tube'],
  ['piccadilly','Piccadilly','#0019A8','tube'],
  ['victoria','Victoria','#039BE5','tube'],
  ['waterloo-city','Waterloo & City','#76D0BD','tube'],
  ['elizabeth','Elizabeth','#60399E','elizabeth'],
  ['dlr','DLR','#00AFAD','dlr'],
  ['liberty','Liberty','#5D6061','overground'],
  ['lioness','Lioness','#FAA61A','overground'],
  ['mildmay','Mildmay','#0077AD','overground'],
  ['suffragette','Suffragette','#5BBD72','overground'],
  ['weaver','Weaver','#823A62','overground'],
  ['windrush','Windrush','#ED1B00','overground'],
  ['tram','Trams','#5FB526','tram'],
];
// Typical dwell (s) at a station and fallback cruise speed (m/s) when no segment time has been learned yet.
const DWELL = {tube:25, dlr:20, elizabeth:40, overground:35, tram:20, bus:15};
const SPEED = {tube:12, dlr:10, elizabeth:17, overground:13, tram:7, bus:6};
const modesWanted = (Q.get('modes') || 'tube,elizabeth,dlr,overground,tram').split(',');
const linesWanted = Q.get('lines') ? Q.get('lines').split(',') : null;
const ACTIVE = LINES.filter(l => modesWanted.includes(l[3]) && (!linesWanted || linesWanted.includes(l[0])))
  .map(([id,name,colour,mode]) => ({id,name,colour,mode,group:mode==='rail'?'rail':'tfl',on:true,count:0,polys:[],routes:[],stops:{},seg:{}}));
const BY = Object.fromEntries(ACTIVE.map(l => [l.id, l]));
// Which services to show: 'tfl' (Underground, Overground, Elizabeth, DLR, trams), 'rail' (National Rail) or 'both'
// Background trains can be switched off; lines used by the current journey are always shown ("pinned")

  l.byName = {}; for(const [id,s] of Object.entries(l.stops)) (l.byName[normName(s.n)] ||= []).push(id);
  l.alias = {};
  l.seg = store.get('segt:'+l.id) || {};
  l.curves = l.polys.map(roundCorners);
  l.layer = new Group(); // lines are drawn on the lines canvas (drawLines); kept so "is loaded" checks work
  l.pathCache = {}; l.snapCache = {}; LANES = null; linesSig = "";
}

// Round each bend of a polyline with a short curve (radius up to ~250 m, never more than
// 40% of either neighbouring stretch). Samples include each curve's midpoint, which is
// where a station on a bend ends up, so trains can stop exactly on the drawn line.
function roundCorners(poly){
  if(poly.length < 3) return poly;
  const kx = Math.cos(poly[0][0]*rad); // lon degrees -> comparable to lat degrees
  const out = [poly[0]];
  for(let i=1;i<poly.length-1;i++){
    const P=poly[i-1], C=poly[i], N=poly[i+1];
    const ax=(P[1]-C[1])*kx, ay=P[0]-C[0], bx=(N[1]-C[1])*kx, by=N[0]-C[0];
    const la=Math.hypot(ax,ay), lb=Math.hypot(bx,by);
    const turn = Math.PI - Math.acos(Math.max(-1, Math.min(1, (ax*bx+ay*by)/(la*lb||1))));
    if(!la || !lb || turn < 0.05){ out.push(C); continue; }
    const r = Math.min(250/111320, la*0.4, lb*0.4);
    const Q1=[C[0]+ay/la*r, C[1]+ax/la*r/kx], Q2=[C[0]+by/lb*r, C[1]+bx/lb*r/kx];
    for(let j=0;j<=8;j++){ const t=j/8, u=1-t; // quadratic Bezier Q1 -> (C) -> Q2
      out.push([u*u*Q1[0]+2*u*t*C[0]+t*t*Q2[0], u*u*Q1[1]+2*u*t*C[1]+t*t*Q2[1]]); }
  }
  out.push(poly[poly.length-1]);
  return out;
}
// A station's spot on the drawn line (nearest curve point), with the line's direction there
function snapAt(l, id){
  if(l.snapCache[id]) return l.snapCache[id];
  const P = l.stops[id].p; let best = {p:P, a:null, b:null}, bd = 250;
  for(const c of l.curves) for(let i=0;i<c.length;i++){
    const d = dist(c[i],P);
    if(d<bd){ bd=d; best={p:c[i], a:c[Math.max(0,i-1)], b:c[Math.min(c.length-1,i+1)]}; }
  }
  return l.snapCache[id] = best;
}
const snapStop = (l, id) => snapAt(l, id).p;

// Map a prediction's naptanId onto a stop of this line's sequence. Interchanges sometimes
// report a different NaPTAN id (Elizabeth at Farringdon/Whitechapel, H&C at Paddington), so match by name.
function resolve(l, id, name){
  if(!id) return null;
  if(l.stops[id]) return id;
  if(id in l.alias) return l.alias[id];
  const n = normName(name); let hit = l.byName[n];
  if(!hit && n) for(const k in l.byName) if(k.startsWith(n+' (')){ hit = l.byName[k]; break; }
  return l.alias[id] = hit ? hit[0] : null;
}

// Path between two stations along the line geometry (falls back to straight line)
function trackPath(l, a, b){
  const key = a+'>'+b; if(l.pathCache[key]) return l.pathCache[key];
  const A = l.stops[a]?.p, B = l.stops[b]?.p; if(!A||!B) return null;
  if(l.skip && l.vk && l.vk[a] && l.vk[b]){ const ka = l.vk[a], kb = l.vk[b], sk = l.skip.get(ka < kb ? ka+'|'+kb : kb+'|'+ka);
    if(sk){ const pts = [A, ...(ka < kb ? sk : sk.slice().reverse()).slice(1, -1), B];
      const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+dist(pts[i-1],pts[i]));
      return l.pathCache[key] = {pts, cum, len:cum[cum.length-1]}; } }
  const straight = dist(A,B);
  let best = null, bestScore = Infinity;
  for(const poly of l.curves){
    let ia=-1, da=1e9, ib=-1, db=1e9;
    for(let i=0;i<poly.length;i++){ const x=dist(poly[i],A), y=dist(poly[i],B); if(x<da){da=x;ia=i} if(y<db){db=y;ib=i} }
    if(da>250||db>250||ia===ib) continue;
    let pts = ia<ib ? poly.slice(ia, ib+1) : poly.slice(ib, ia+1).reverse();
    let len=0; for(let i=1;i<pts.length;i++) len+=dist(pts[i-1],pts[i]);
    if(len>straight*3+500) continue;
    const score = da+db+len*0.01;
    if(score<bestScore){ bestScore=score; best=pts; }
  }
  let pts = best;
  if(!pts){ // no drawn line joins these stations: draw one, so the train still sits on a line
    pts = [snapStop(l,a), snapStop(l,b)];
    const fk = [a, b].sort().join('|'); l.fb ||= new Set();
    if(!l.fb.has(fk)){ l.fb.add(fk); l.polys.push([l.stops[a].p, l.stops[b].p]); LANES = null; linesSig = ""; } // drawn by drawLines from now on
  }
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+dist(pts[i-1],pts[i]));
  return l.pathCache[key] = {pts, cum, len:cum[cum.length-1]};
}
// Nearest point on a path to p -> {p, a, b} (keeps eased trains on the line)
function project(path, p){
  const P = path.pts, kx = Math.cos(p[0]*rad); let best = null, bd = Infinity;
  for(let i=1;i<P.length;i++){
    const A=P[i-1], B=P[i], vx=(B[1]-A[1])*kx, vy=B[0]-A[0], wx=(p[1]-A[1])*kx, wy=p[0]-A[0];
    const L2 = vx*vx+vy*vy, k = L2 ? Math.max(0, Math.min(1, (vx*wx+vy*wy)/L2)) : 0;
    const q = [A[0]+(B[0]-A[0])*k, A[1]+(B[1]-A[1])*k], d = (q[0]-p[0])**2 + ((q[1]-p[1])*kx)**2;
    if(d<bd){ bd=d; best={p:q, a:A, b:B}; }
  }
  return best;
}
function along(path, f){ // fraction 0..1 -> {p, a, b}
  const t = f*path.len, c = path.cum, p = path.pts;
  let i=1; while(i<c.length-1 && c[i]<t) i++;
  const seg = c[i]-c[i-1] || 1, k = Math.min(1, Math.max(0, (t-c[i-1])/seg));
  return {p:[p[i-1][0]+(p[i][0]-p[i-1][0])*k, p[i-1][1]+(p[i][1]-p[i-1][1])*k], a:p[i-1], b:p[i]};
}

// Where a train at `next` (heading on towards `later`) came from, and where it goes after.
function routeCtx(l, next, later, dirHint){
  if(later && later!==next) for(const r of l.routes){
    const i = r.ids.indexOf(next), j = r.ids.indexOf(later);
    if(i>0 && j>i) return {prev:r.ids[i-1], after:r.ids[i+1]};
  }
  if(dirHint) for(const r of l.routes){
    if(r.dir!==dirHint) continue;
    const i = r.ids.indexOf(next);
    if(i>0) return {prev:r.ids[i-1], after:r.ids[i+1]||null};
  }
  return null;
}

// Run time (s) between adjacent stations: learned from live data, else estimated from distance.
function segTime(l, a, b){
  const k = l.seg[a+'>'+b] ?? l.seg[b+'>'+a];
  if(k) return k;
  const p = trackPath(l, a, b);
  return Math.max(45, (p ? p.len : 1000)/SPEED[l.mode] + 20);
}
function learn(l, a, b, diff){
  if(!l.adj.has(a+'>'+b)) return;
  const run = diff - DWELL[l.mode];
  if(run < 20 || run > 900) return;
  const k = a+'>'+b, o = l.seg[k];
  l.seg[k] = Math.round(o ? o*0.8 + run*0.2 : run);
}

// ---------- service status (TfL) ----------
// level: 0 good, 1 minor delays etc., 2 severe / part closure, 3 closed / suspended
const STATUS = new Map();
const SEV_LEVEL = s => [1,2,4,16,20].includes(s) ? 3 : [3,5,6,11].includes(s) ? 2 : [10,18,19].includes(s) ? 0 : 1;
const LEVEL_NAME = ['Good service', 'Minor delays', 'Severe delays', 'Closed'];
async function refreshStatus(){
  try{
    const ids = ACTIVE.filter(l => l.mode !== 'bus').map(l => l.id);
    const res = await get(`/Line/${ids.join(',')}/Status`);
    STATUS.clear();
    for(const l of res){
      const ss = (l.lineStatuses || []).map(s => ({lv:SEV_LEVEL(s.statusSeverity), text:s.statusSeverityDescription, reason:(s.reason||'').trim()}));
      ss.sort((a, b) => b.lv - a.lv);

      // reasons: drop the "Line name:" prefix and duplicates
      const reasons = [...new Set(ss.map(s => s.reason.replace(/^[A-Za-z&' ]{2,40}(line|LINE|Line)?:\s*(?!\d)/, '')).filter(Boolean))];
      STATUS.set(l.id, {lv:top.lv, text:top.lv ? top.text : 'Good service', reasons});
    }

  }catch(e){ console.warn('status', e.message); }
}
const lineStatus = id => STATUS.get(id) || null;
const statusBadge = (id, short) => { const s = lineStatus(id); if(!s || !s.lv) return '';
  return `<span class="st st${s.lv}" title="${esc(s.reasons[0] || s.text)}">${esc(short ? ['', 'Delays', 'Severe', 'Closed'][s.lv] : s.text)}</span>`; };
setTimeout(refreshStatus, 1500); setInterval(refreshStatus, 120000);

// ---------- live trains ----------
let trains = new Map(); // key -> train state
let skew = 0; // server time - local time (ms), only used if the local clock is clearly wrong
const now = () => Date.now() + skew;
let failStreak = 0, anonSeq = 0;

async function refresh(){
  // retry any line whose geometry failed to load at boot (e.g. network blip when the TV woke up)
  for(const l of ACTIVE) if(!l.layer){ try{ await loadLine(l); }catch(e){} }
  const ids = ACTIVE.filter(l => shown(l) && l.layer).map(l=>l.id);
  const chunks = []; for(let i=0;i<ids.length;i+=8) chunks.push(ids.slice(i,i+8));
  const res = await Promise.allSettled(chunks.map(c => get(`/Line/${c.join(',')}/Arrivals`)));
  let preds = []; const failed = new Set(); let err = null;
  res.forEach((r,i) => { if(r.status==='fulfilled') preds = preds.concat(r.value); else { err = r.reason; chunks[i].forEach(id => failed.add(id)); } });
  if(err){
    failStreak++;
    $('err').textContent = 'Live train data error: ' + err.message + (err.status===429 ? (KEY ? ' — rate limited, or the app_key is invalid' : ' — rate limited; add ?app_key= (free from api-portal.tfl.gov.uk)') : '') + ' (retrying)';
    if(failed.size === ids.length) return false;
  } else { failStreak = 0; $('err').textContent = ''; }

  const t0 = Date.now();
  const stamps = preds.map(p=>Date.parse(p.timestamp)).filter(Boolean);
  if(stamps.length){ const s = Math.max(...stamps) - t0; skew = Math.abs(s) > 120e3 ? s : 0; }

  const out = [];   // {key, line, next, prev, arr, towards, loc}
  const groups = new Map(), anon = [];
  for(const p of preds){
    const l = BY[p.lineId]; if(!l || !l.routes.length) continue;
    p.S = resolve(l, p.naptanId, p.stationName); if(!p.S) continue;
    p.D = resolve(l, p.destinationNaptanId, p.destinationName);
    const vid = (p.vehicleId||'').trim();
    if(vid && !/^0+$/.test(vid)){ const k = p.lineId+':'+vid; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(p); }
    else anon.push(p);
  }

  // 1. Trains with a vehicle id: next stop = soonest prediction, direction from the stop after it.
  for(const [key, list] of groups){
    list.sort((a,b)=>a.timeToStation-b.timeToStation);
    const l = BY[list[0].lineId];
    // one entry per station (interchanges can list the same train under two stop ids, e.g. Paddington)
    const seq = [];
    for(const p of list){ const q = seq[seq.length-1]; if(!q || (q.S !== p.S && dist(l.stops[q.S].p, l.stops[p.S].p) > 400)) seq.push(p); }
    for(let i=1;i<seq.length;i++) learn(l, seq[i-1].S, seq[i].S, seq[i].timeToStation - seq[i-1].timeToStation);
    // Already at/leaving a stop (often the origin terminus, which has no previous stop):
    // treat the following stop as next, so the train sits at this one until it departs.
    while(seq.length > 1 && seq[0].timeToStation <= 0) seq.shift();
    let first = seq[0];
    // Rail feeds list timetabled trips at their starting station long before they leave: if the
    // following station is much further off than the run time, the train isn't really there yet.
    if(seq[1] && seq[1].timeToStation - first.timeToStation > segTime(l, first.S, seq[1].S) + 300) continue;
    let prev = routeCtx(l, first.S, seq[1]?.S || first.D, first.direction)?.prev || null;
    if(!prev && seq[1]){ prev = first.S; first = seq[1]; } // at its origin: wait there until it departs
    if(!prev && first.timeToStation > 120) continue;          // not started yet / in a siding
    if(prev && first.timeToStation > segTime(l, prev, first.S) + 600) continue; // too far out to place
    // keep the next few stops with TfL's own times, so the train can carry on past a stop whose
    // predicted time has passed (the feed is ~60 s old, so that happens all the time)
    const ahead = seq.slice(seq.indexOf(first), seq.indexOf(first)+4).map(p => [p.S, Date.parse(p.expectedArrival)]);
    out.push({key, line:l.id, next:first.S, prev, arr:ahead[0][1], ahead, towards:first.towards||first.destinationName||'', loc:first.currentLocation||'', ...(DEBUG?{raw:list.map(p=>[p.S,p.D,p.timeToStation,p.direction,p.destinationNaptanId])}:{})});
  }

  // 2. Trains without a vehicle id (all of DLR, some Metropolitan): every train shows up at
  //    several stations, so count trains per segment. A prediction at stop S coming from P
  //    is the same train as an earlier one at P if it arrives after it; whatever is left
  //    over at S must be a train already between P and S.
  const seen2 = new Set(), at = new Map(), bySeg = new Map();
  for(const p of anon){
    const l = BY[p.lineId];
    const k = [p.lineId, p.S, p.platformName, p.D, Math.round(p.timeToStation/20)].join('|');
    if(seen2.has(k)) continue; seen2.add(k);
    const ctx = routeCtx(l, p.S, p.D, p.direction); if(!ctx) continue;
    p.prev = ctx.prev; p.after = ctx.after;
    const ka = p.lineId+'|'+p.S+'|'+p.after; if(!at.has(ka)) at.set(ka, []); at.get(ka).push(p.timeToStation);
    const ks = p.lineId+'|'+p.prev+'|'+p.S; if(!bySeg.has(ks)) bySeg.set(ks, []); bySeg.get(ks).push(p);
  }
  for(const [ks, list] of bySeg){
    const [lineId, prev, S] = ks.split('|'), l = BY[lineId];
    const run = segTime(l, prev, S);
    const up = (at.get(lineId+'|'+prev+'|'+S) || []).slice().sort((a,b)=>a-b);
    list.sort((a,b)=>a.timeToStation-b.timeToStation);
    const used = new Array(list.length).fill(false);
    for(const s of up){ const i = list.findIndex((p,i) => !used[i] && p.timeToStation > s + 15); if(i>=0) used[i] = true; }
    list.forEach((p,i) => {
      if(used[i] || p.timeToStation > run + 90) return;
      out.push({key:null, anon:true, line:lineId, next:S, prev, arr:Date.parse(p.expectedArrival),
        towards:p.towards||p.destinationName||'', loc:p.currentLocation||''});
    });
  }
  // No ids, so follow each anonymous train by matching it to the nearest one from the last refresh.
  const olds = [...trains.values()].filter(t => t.anon && t.d), cand = [];
  for(const o of out) if(o.anon){
    const pos = placeTrain(o); if(!pos) continue;
    for(const t of olds) if(t.line===o.line && t.towards===o.towards){ const d = dist(t.d, pos.p); if(d < 2000) cand.push([d, o, t]); }
  }
  cand.sort((a,b)=>a[0]-b[0]);
  for(const [, o, t] of cand) if(!o.key && !t.claimed){ o.key = t.key; t.claimed = true; }
  for(const t of olds) delete t.claimed;
  for(const o of out) if(!o.key) o.key = o.line+':a'+(++anonSeq);

  // merge into persistent state
  const keep = new Set(), fresh = [];
  for(const o of out){
    let t = trains.get(o.key);
    if(!t){ t = {key:o.key}; trains.set(o.key, t); fresh.push(t); }
    delete o.f; delete o.fk;  // progress state belongs to the persistent train
    Object.assign(t, o, {seen:t0}); keep.add(o.key);

  const gone = [];
  for(const [k,t] of trains) if(!keep.has(k)){
    if(failed.has(t.line)){ t.seen = t0; continue; }           // that request failed: keep as is
    if(t.anon || t0 - t.seen > REFRESH*2.5){ trains.delete(k); gone.push(t); }
  }
  // A train that moved on to a new segment gets a new key: carry its on-screen position over so it glides.
  for(const t of fresh){
    let best = null, bd = 1500;
    for(const g of gone){
      if(g.line!==t.line || !g.d || g.taken) continue;
      const pos = placeTrain(t); if(!pos) continue;
      const d = dist(g.d, pos.p); if(d<bd){ bd=d; best=g; }
    }
    if(best){ best.taken = true; t.d = best.d; t.ang = best.ang; }
  }
  for(const l of ACTIVE){ l.count = 0; if(!failed.has(l.id)) store.set('segt:'+l.id, l.seg, 30*864e5); }
  for(const t of trains.values()) if(t0 - t.seen < REFRESH*1.5) BY[t.line].count++;
  window.onTrainsUpdate && onTrainsUpdate(ACTIVE.reduce((s,l)=>s+(shown(l)?l.count:0),0));
  return !err;
}

// Where is a train right now?
function placeTrain(t){
  const l = BY[t.line], n = now();
  let prev = t.prev, next = t.next, arr = t.arr;

    let k = 0; while(k < t.ahead.length-1 && t.ahead[k][1] < n) k++;
    if(k){ prev = t.ahead[k-1][0]; }
    [next, arr] = t.ahead[k];
  }
  t.cur = next; t.curArr = arr;
  if(!l.stops[next]) return null;
  if(!prev || !l.stops[prev]) return snapAt(l, next);
  const path = trackPath(l, prev, next); if(!path) return snapAt(l, next);
  const remain = (arr - n)/1000;
  let f = Math.min(1, Math.max(0, 1 - remain/segTime(l, prev, next)));
  // trains don't reverse: if a prediction slips, hold position instead of sliding back
  const sk = prev+'>'+next;
  if(t.fk === sk && f < t.f) f = t.f; else { t.fk = sk; t.f = f; }
  return Object.assign(along(path, f), {path});
}

// ---------- drawing ----------
let hover = null, lastDraw = 0;
const HL = new Set(); // keys of highlighted trains (the user's vehicle)
// real train sizes in metres [length, width]: e.g. a 7-car 1973/1992 Tube stock is ~110-130 m, Class 345 is 205 m
const REAL_SIZE = {tube:[113, 2.65], elizabeth:[205, 2.8], overground:[100, 2.8], dlr:[87, 2.65], tram:[32, 2.65], bus:[11, 2.55], rail:[200, 2.8]};
let SHOW_ICONS = (() => { try{ return localStorage.getItem('trainIcons') !== '0'; }catch(e){ return true; } })();
const TAU = 2; // seconds: corrections after a refresh glide rather than jump
function draw(ts){
  requestAnimationFrame(draw);
  if(ts - lastDraw < 1000/FPS - 2) return;
  const dt = Math.min(1, (ts - lastDraw)/1000); lastDraw = ts;
  const t0 = DEBUG ? performance.now() : 0;
  const k = 1 - Math.exp(-dt/TAU), ka = 1 - Math.exp(-dt/0.4);
  if(!ov.getProjection()) return;
  viewNow(); drawLines();
  const s = mapSize(); ctx.clearRect(0,0,s.x,s.y);
  // train size: a long thin rectangle, roughly tube-train proportions (not to scale)
  const z = PV.z, hl0 = Math.max(7, Math.min(16, (z-9)*3)), hw0 = Math.max(2.2, hl0/3.6);
  // zoomed right in: once a real train would be bigger than the icon, draw it at real size
  const mpp = 156543.03*Math.cos(map.getCenter().lat()*rad)/2**z; // metres per screen pixel
  const size = l => { const [len, wid] = REAL_SIZE[l.mode] || REAL_SIZE.tube;
    return [Math.max(hl0, len/2/mpp), Math.max(hw0, wid/2/mpp)]; };
  let hl = hl0, hw = hw0;
  const wall = Date.now(), cosLat = Math.cos(map.getCenter().lat()*rad);
  const drawn = [], byLine = new Map();
  for(const t of trains.values()){
    const l = BY[t.line]; if(!l.on || !shown(l) || wall - t.seen > REFRESH*1.5) continue;
    const pos = placeTrain(t); if(!pos) continue;
    // ease the displayed position, then put it back onto the line so it never cuts corners
    if(!t.d || dist(t.d, pos.p) > 3000) t.d = pos.p.slice();
    else { t.d[0]+= (pos.p[0]-t.d[0])*k; t.d[1]+= (pos.p[1]-t.d[1])*k; }
    let on = pos;
    if(pos.path){ on = project(pos.path, t.d); t.d = on.p.slice(); }
    else t.d = pos.p.slice();
    let ang = t.ang ?? 0;
    if(on.a && on.b){ const dx=(on.b[1]-on.a[1])*cosLat, dy=on.a[0]-on.b[0]; if(dx||dy) ang=Math.atan2(dy,dx); }
    // the rectangle looks the same both ways round, so turn it the short way (mod 180°)

    const ux = cs*hl, uy = sn*hl, vx = -sn*hw, vy = cs*hw; // half-length and half-width vectors

function nearestOnPath(path, p){ // -> {d (m), along (m from start), total (m)}

    const vx=(B[1]-A[1])*kx, vy=B[0]-A[0], wx=(p[1]-A[1])*kx, wy=p[0]-A[0], L2 = vx*vx+vy*vy;

    const q = [A[0]+(B[0]-A[0])*k, A[1]+(B[1]-A[1])*k], d = dist(q, p);
    if(d < best.d) best = {d, along:acc + seg*k};

// ---------- alerts: time to leave, get off at the next stop, arrived ----------
// "the Victoria line", "the 148 bus", "the DLR", "the Southern" (National Rail operators stay as they are)
function svcName(L){
  const n = (L.lineName || L.mode || '').trim();
  if(L.kind === 'bus') return `${n} bus`;
  if(/^(dlr|trams?)$/i.test(n) || /line$/i.test(n) || ['rail','dlr','tram','boat','other'].includes(L.kind) || L.gen) return n;
  return `${n} line`;
}
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function notify(title, body){
  try{ if(navigator.userActivation?.hasBeenActive) navigator.vibrate?.([200, 100, 200]); }catch(e){}
  if(!('Notification' in window) || Notification.permission !== 'granted' || document.visibilityState === 'visible' && document.hasFocus()) return;
  try{ const reg = await navigator.serviceWorker?.getRegistration(); if(reg) reg.showNotification(title, {body, tag:'journey', renotify:true}); else new Notification(title, {body, tag:'journey'}); }catch(e){}
}
function setAlert(key, icon, title, sub){
  J.alert = {key, icon, title, sub, at:Date.now()};
  if(!J.fired.has(key)){ J.fired.add(key); notify(title, sub || ''); }
}
function checkAlerts(){
  if(!J.active || !J.plan) return;
  const legs = J.plan.legs, L = legs[J.idx], n = Date.now(); J.fired ||= new Set();
  let shown = false;
  // 1. time to leave for the first vehicle you catch
  const first = legs.find(x => !x.walk);
  if(first && J.idx <= legs.indexOf(first) && !J.riding){
    const walkLeft = legs.slice(J.idx, legs.indexOf(first)).reduce((s, x) => s + Math.max(0, (x.eta ?? x.arr) - Math.max(n, x.dep)), 0);
    const board = first.board ?? first.dep, slack = board - n - walkLeft;
    if(slack < 90000 && slack > -60000){ setAlert('leave' + legs.indexOf(first), '🚶', slack > 0 ? 'Time to go' : 'Hurry up', `Leave now to catch the ${hhmm(board)} ${svcName(first)}`); shown = true; }
  }
  // 2. on board: your stop is next
  if(L && !L.walk && J.riding){
    const t = J.vehicle && trains.get(J.vehicle.line + ':' + J.vehicle.vid.trim());
    const nextIsMine = t && L.to.id && (t.cur || t.next) === L.to.id;
    const left = (L.eta ?? L.arr) - n;
    if(t && L.to.id ? nextIsMine : (left > 0 && left < 100000)){
      const after = legs.slice(J.idx + 1).find(x => !x.walk);
      setAlert('off' + J.idx, '🔔', `Get off at the next stop: ${L.to.name}`, after ? `Then change for the ${svcName(after)}` : 'Your last stop');
      shown = true;
    }
  }
  // 3. arrived
  if(J.idx === legs.length - 1 && L.walk && (gpsFresh() ? nearestOnPath(L.path, me).total - nearestOnPath(L.path, me).along < 40 : n > (L.eta ?? L.arr))){
    setAlert('arrived', '🏁', `You've arrived`, J.to.label); shown = true;
  }
  if(!shown && J.alert && n - J.alert.at > 20000) J.alert = null;
}
$('bShare').onclick = async () => {
  const eta = J.proj ?? J.plan.arr, base = J.baseArr ?? J.plan.arr, late = eta - base;
  const text = `I'm on my way to ${J.to.label}. Arriving around ${hhmm(eta)}${late > 120000 ? ` (running ${mins(late)} min late)` : ''}.`;
  try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Copied: ' + text); }catch(e){ toast(text); }
};

async function highlightVehicle(gen){
  HL.clear();
  const L = J.plan.legs.slice(J.idx).find(L => !L.walk);
  if(!L || !L.line || !J.vehicle || !LIVE_KINDS.has(L.kind)) return;
  if(!BY[L.line] || L.kind==='bus'){ await addLine(L.line, L.lineName, L.colour, L.kind); if(gen !== J.gen || !J.active) return; }
  else if(!BY[L.line].pinned){ BY[L.line].pinned = true; BY[L.line].layer && BY[L.line].layer.eachLayer(p => p.setStyle(lineStyle(BY[L.line]))); }
  HL.add(J.vehicle.line + ':' + J.vehicle.vid.trim());
}

// ---------- start / switch / stop ----------
const RUN_FIELDS = ['eta', 'board', 'missed', 'pick', 'live', 'wait', 'enriching'];
async function startJourney(j, keep){
  if(J.starting) return; J.starting = true;
  try{
    j = structuredClone(j); // start from a clean copy each time
    try{ if('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }catch(e){}
    if(!keep) for(const L of j.legs) for(const f of RUN_FIELDS) delete L[f];
    Object.assign(J, {plan:j, active:true, idx:0, riding:false, vehicle:null, proj:null, suggestion:null, dismissed:null,
      note:null, noteAt:0, offCount:0, moved:false, baseArr:null, alert:null, fired:new Set(), lastReplan:Date.now(), follow:true, gen:(J.gen||0) + 1});
    window.DIM_TRAINS = true;
    showView('active'); renderActive(true);
    drawJourney(j, routeLayer); altLayer.clearLayers(); fitJourney(j);
    await Promise.all(j.legs.map(L => enrichLeg(L).catch(() => {})));
    try{ if(!J.wake) J.wake = await navigator.wakeLock?.request('screen'); }catch(e){}
    monitor(); refresh().catch(()=>{});
  } finally { J.starting = false; }
}
async function adoptPlan(j){
  const keepRiding = J.riding && j.prefixed;
  Object.assign(J, {plan:j, idx:0, riding:keepRiding, suggestion:null, dismissed:null, baseArr:null, gen:(J.gen||0) + 1});
  if(!keepRiding) J.vehicle = null;
  if(j.chain) J.to = {label:j.chain[j.chain.length-1].label || J.to.label, q:j.chain[j.chain.length-1].q};
  drawJourney(J.plan, routeLayer); altLayer.clearLayers();
  await Promise.all(J.plan.legs.map(L => enrichLeg(L).catch(() => {})));
}
async function switchRoute(){
  const s = J.suggestion; if(!s) return;
  J.proj = null; await adoptPlan(s.journey); monitor();
}
function keepRoute(){ if(J.suggestion){ J.dismissed = J.suggestion.sig; J.suggestion = null; altLayer.clearLayers(); renderActive(); } }
function endJourney(){
  J.active = false; J.plan = null; J.suggestion = null; J.gen = (J.gen||0) + 1; HL.clear(); unpinAll(); window.DIM_TRAINS = false;
  routeLayer.clearLayers(); altLayer.clearLayers(); previewFocus(null);
  try{ J.wake && J.wake.release(); }catch(e){} J.wake = null;
  try{ localStorage.removeItem('journey'); }catch(e){}
  showView(J.optEl === 'chainOut' ? 'build' : 'search');
}
function saveState(){ try{ localStorage.setItem('journey', JSON.stringify({to:J.to, plan:J.plan, idx:J.idx, riding:J.riding, vehicle:J.vehicle, baseArr:J.baseArr})); }catch(e){} }
function restoreState(){
  try{
    const s = JSON.parse(localStorage.getItem('journey')); if(!s || !s.plan || s.plan.arr < Date.now() - 600000) return false;
    J.to = s.to; startJourney(s.plan, true).then(() => { Object.assign(J, {idx:s.idx, riding:s.riding, vehicle:s.vehicle, baseArr:s.baseArr ?? null}); monitor(); }); return true;
  }catch(e){ return false; }
}

// ---------- UI ----------
const icon = (L, s = 18) => L.walk ? symbol(L.kind==='cycle' ? 'cycle' : L.kind==='drive' ? 'drive' : 'walk', L.kind==='cycle' ? '#1e8e3e' : dark ? '#b0b4ba' : '#5f6368', s) : L.gen ? symbol('gen', L.colour, s) : symbol(L.kind==='other' ? 'rail' : L.kind, L.colour, s);
const pill = L => L.walk ? `<span class="pill walk">${icon(L, 14)} ${mins(L.arr-L.dep)}</span>`
  : `<span class="pill" style="--c:${L.colour}">${icon(L, 15)} ${esc(L.kind==='bus' ? L.lineName : (L.lineName||L.mode).replace(/ line$/i,''))}</span>`;

function showView(v){ $('panel').scrollTop = 0; setTimeout(() => typeof renderNearby === 'function' && renderNearby(), 0); $('tabs').hidden = v === 'active';
  if(v !== 'active') for(const b of $('tabs').children){ b.classList.toggle('sel', b.dataset.t === v); b.setAttribute('aria-selected', b.dataset.t === v); } for(const el of document.querySelectorAll('.view')) el.hidden = el.dataset.view !== v; document.body.dataset.view = v; }

// worst status among the lines a journey uses (TfL lines only)
function routeWarn(j){
  let worst = null;
  for(const L of j.legs){ const id = L.line || L.tflLine; const s = id && lineStatus(id);
    if(s && s.lv && (!worst || s.lv > worst.s.lv)) worst = {s, name:BY[id] ? BY[id].name : L.lineName}; }
  if(!worst) return j.legs.some(L => L.disrupted) ? '<div class="warn">⚠ Disruption on this route</div>' : '';
  return `<div class="warn">⚠ ${esc(worst.s.text)} on the ${esc(worst.name)}${/line$/i.test(worst.name) ? '' : ' line'}</div>`;
}
function renderOptions(el = $(J.optEl || 'options')){
  el.innerHTML = saveBar() + J.options.map((j, i) => `
    <button class="opt ${i===J.sel?'sel':''}" data-i="${i}">
      <div class="opt-top"><b>${hhmm(j.dep)} → ${hhmm(j.arr)}</b><span>${j.fare ? `<small class="fare">${esc(j.fare)}</small> · ` : ''}${mins(j.arr-j.dep)} min</span></div>
      <div class="pills">${j.legs.map(pill).join('<span class="sep">›</span>')}</div>
      ${routeWarn(j)}${j.note ? `<div class="muted" style="font-size:12px">${esc(j.note)}</div>` : ''}

    </button>`).join('') + (J.options.length ? `<div class="row2"><button id="go" class="primary" style="flex:1">Start journey</button>${J.optEl === 'options' ? '<button type="button" id="custom" title="Change the steps of this route in Build my route">Customise</button>' : ''}</div>` : '');
}
// Copy a planned route into "Build my route": one stop per change, one mode per vehicle
function customise(j){
  const modeOf = L => /bus/.test(L.mode) || L.kind === 'bus' ? 'bus' : /tram/.test(L.mode) || L.kind === 'tram' ? 'tram'
    : /subway|metro|light_rail/.test(L.mode) || ['tube','dlr'].includes(L.kind) ? 'tube' : /rail|train/.test(L.mode) || ['rail','overground','elizabeth'].includes(L.kind) ? 'train' : 'any';
  const rides = j.legs.filter(L => !L.walk && L.kind !== 'cycle' && L.kind !== 'drive');
  const stops = [$('from').value.trim()], modes = [], pids = {};
  if(J.from && J.from.label) pids[J.from.label] = J.from.q;
  if(!rides.length){ stops.push(J.to.label); modes.push('walk'); }
  rides.forEach((L, i) => {
    modes.push(modeOf(L));
    const last = i === rides.length - 1, name = last ? J.to.label : L.to.name;
    stops.push(name); pids[name] = last ? J.to.q : L.to.p.map(x => x.toFixed(5)).join(',');
  });
  CH = {stops, modes, pids}; saveChain();
  showView('build'); renderChain(); $('chainOut').innerHTML = '<div class="muted">Change any step, then tap Plan.</div>';
}
const placeName = p => p.placeType==='PointOfInterest' ? p.commonName.replace(/^[^,]+,\s*/, '') : cleanName(p.commonName);
function renderAmbiguous(d){
  const box = [];
  for(const [key, label] of [['fromLocationDisambiguation','From'], ['toLocationDisambiguation','To']]){
    const opts = (d[key]?.disambiguationOptions || []).slice(0, 6);
    if(!opts.length || d[key].matchStatus === 'identified') continue;
    box.push(`<div class="amb-h">${label}: did you mean…</div>` + opts.map(o => `<button class="amb" data-end="${label}" data-q="${esc(o.parameterValue)}" data-label="${esc(placeName(o.place))}">${esc(placeName(o.place))}<small>${esc(o.place.placeType==='StopPoint'?'Stop / station':o.place.placeType==='PointOfInterest'?'Place':o.place.placeType||'')}</small></button>`).join(''));
  }
  $('options').innerHTML = box.join('');
}

// "Leave at" time: today, or tomorrow if that time has already passed (by more than 30 min)
let whenMode = 'leave';
$('whenMode').onclick = () => { whenMode = whenMode === 'leave' ? 'arrive' : 'leave'; $('whenMode').textContent = whenMode === 'leave' ? 'Leave' : 'Arrive by';
  if(!$('when').value) $('when').focus(); };
function leaveAt(v){ const [hh, mm] = v.split(':').map(Number); const d = new Date(); d.setHours(hh, mm, 0, 0);
  if(+d < Date.now() - 1800000) d.setDate(d.getDate() + 1); return +d; }
// wait up to ~30 s for a GPS fix, then ask for a typed start
// Wait (up to ~30 s) for a location fix. Stops as soon as you search again or type a start;
// says straight away if location is blocked or unavailable.
let gpsWait = 0;
function waitForGps(el, retry, fromInput, seq = ++gpsWait, tries = 0){
  if(seq !== gpsWait || fromInput.value.trim()) return; // superseded: a new search, or a start was typed
  const ask = why => { el.innerHTML = `<div class="muted">${why} Type a starting point in <b>From</b>, then press Go.</div>`; fromInput.focus(); };
  if(geoErr === 'denied') return ask('Location is turned off for this site.');
  if(geoErr === 'unavailable' && tries > 2) return ask('Your location isn\'t available.');
  if(tries > 12) return ask('Can\'t find your location.');
  el.innerHTML = '<div class="muted">Finding your location… (or type a starting point)</div>';
  setTimeout(() => { if(seq !== gpsWait) return; me ? retry() : waitForGps(el, retry, fromInput, seq, tries + 1); }, 2500);
}
async function search(){
  gpsWait++; J.options = [];
  const toTxt = $('to').value.trim(); if(!toTxt) return $('to').focus();
  if(!J.to || J.to.label !== toTxt) J.to = {label:toTxt, q:toTxt};
  const fromTxt = $('from').value.trim();
  if(!fromTxt){
    if(!me) return waitForGps($('options'), search, $('from'));
    J.from = {label:'', q:`${me[0].toFixed(5)},${me[1].toFixed(5)}`};
  } else if(!J.from || J.from.label !== fromTxt) J.from = {label:fromTxt, q:fromTxt};
  let when = Date.now();
  if($('when').value) when = leaveAt($('when').value);
  ARRIVE = whenMode === 'arrive' && !!$('when').value;
  $('options').innerHTML = '<div class="muted">Finding routes…</div>'; $('nearby').innerHTML = ''; nb.focus = null;
  let r = null;
  try{
    // Google plans everything (all transport, anywhere); TfL's planner is the backup if Google fails
    const tq = x => x.q.startsWith('place_id:') ? x.label : x.q;
    if(PREF === 'stepfree'){ // only TfL knows which stations are step-free
      if(!inLondon(J.from.q) || (isCoord(J.to.q) && !inLondon(J.to.q))) throw new Error('Step-free routes are only available for journeys in London.');
      try{ r = await planJourneys(tq(J.from), tq(J.to), when); }catch(e){ r = {journeys:[]}; }
      if(r.ambiguous) return renderAmbiguous(r.ambiguous);
      for(const j of r.journeys) for(const L of j.legs) if(!L.walk && BY[L.line]){ L.tflLine = L.line; }
      if(!r.journeys.length){ // no step-free rail route: every London bus is step-free
        const saved = PREF; PREF = 'busonly';
        try{ r = await planGoogle(J.from.q, J.to.q, when); }finally{ PREF = saved; }
        r.journeys.forEach(j => j.note = 'No step-free train route found, so this uses buses (all step-free).');
      }
    } else try{
      r = await planGoogle(J.from.q, J.to.q, when); if(r.end) J.to.q = r.end.map(x => x.toFixed(5)).join(',');
      for(const j of r.journeys){ const last = j.legs[j.legs.length-1]; if(last.walk){ last.summary = 'Walk to ' + toTxt; last.to.name = toTxt; } }
    }
    catch(e){
      if(/No public transport|not found/i.test(e.message) || !inLondon(J.from.q)) throw e;
      r = await planJourneys(tq(J.from), tq(J.to), when);
      if(r.ambiguous) return renderAmbiguous(r.ambiguous);
    }
    ARRIVE = false;
    J.options = r.journeys.slice(0, 4); J.sel = 0; J.optEl = 'options';
    if(whenMode === 'arrive' && $('when').value) J.options.sort((a, b) => b.dep - a.dep); // latest you can leave first
    if(!J.options.length){ $('options').innerHTML = '<div class="muted">No routes found.</div>'; return; }
    renderOptions(); drawJourney(J.options[0], routeLayer); fitJourney(J.options[0]);
    try{ localStorage.setItem('lastTo', JSON.stringify(J.to)); }catch(e){}
    if(J.pendingSave){ savePlace(J.pendingSave, J.to); J.pendingSave = null; $('to').placeholder = 'Place, station or postcode'; }
    addRecent(J.to);
  }catch(e){ ARRIVE = false; $('options').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

function legWarn(L){
  const id = L.line || L.tflLine, s = id && lineStatus(id);
  if(s && s.lv) return `<div class="warn">⚠ ${esc(s.text)}${s.reasons[0] ? ': ' + esc(s.reasons[0].replace(/\s*(Good service|Valid tickets).*$/i, '')) : ''}</div>`;
  return L.disrupted ? '<div class="warn">⚠ Disruption reported on this line</div>' : '';
}
function legRow(L, i){
  const cur = i === J.idx, done = i < J.idx;
  let live = '';
  if(!L.walk && !done){
    if(cur && J.riding) live = `On board · arriving ${esc(L.to.name)} <b>${hhmm(L.eta||L.arr)}</b>`;
    else if(L.live && L.live.length){
      const n = Date.now(), next = L.live.filter(d => d.at > n - 30000).slice(0, 3).map(d => d===L.pick ? `<b>${Math.max(0, mins(d.at-n))}</b>` : Math.max(0, mins(d.at-n)));
      live = `Next: ${next.join(', ')} min` + (L.pick ? ` · catch the <b>${hhmm(L.pick.at)}</b>` : '');
    } else if(L.missed) live = `<span class="bad">Planned ${hhmm(L.dep)} service missed</span>`;
    else live = `Departs ${hhmm(L.board ?? L.dep)}` + (LIVE_KINDS.has(L.kind) ? '' : ' (timetable)');
  }
  const time = L.walk ? `${mins(L.arr-L.dep)} min` : `${hhmm(L.board ?? L.dep)}–${hhmm(L.eta ?? L.arr)}`;
  return `<li class="${cur?'cur':''} ${done?'done':''}" style="--c:${L.colour}">
    <div class="li-h">${icon(L)} <span>${esc(L.summary)}</span><small>${time}</small></div>
    ${L.walk ? '' : `<div class="li-d">${esc(L.from.name)} → ${esc(L.to.name)}${L.towards?` · towards ${esc(L.towards)}`:''}${L.nStops?` · ${L.nStops} stop${L.nStops>1?'s':''}`:''}</div>`}
    ${live ? `<div class="li-live">${live}</div>` : ''}
    ${legWarn(L)}
  </li>`;
}
const setHTML = (el, html) => { if(el._html !== html){ el.innerHTML = html; el._html = html; } };
function renderActive(force){
  if(!J.active || !J.plan) return;
  if(force) for(const id of ['eta','note','banner','steps','alert']) $(id)._html = null;
  const base = J.baseArr ?? J.plan.arr, late = (J.proj ?? base) - base, n = Date.now();
  const st = !J.proj ? ['Checking live times…', 'muted'] : late > 120000 ? [`${mins(late)} min late`, 'bad'] : late < -120000 ? [`${mins(-late)} min early`, 'good'] : ['On time', 'good'];
  setHTML($('eta'), `<div class="eta-big">Arrive <b>${hhmm(J.proj ?? J.plan.arr)}</b></div><div class="chip ${st[1]}">${st[0]}</div>
    <div class="muted">${esc(J.to.label)} · ${Math.max(0, mins((J.proj ?? J.plan.arr) - n))} min to go</div>`);
  $('alert').hidden = !J.alert;
  if(J.alert) setHTML($('alert'), `<span class="ai">${J.alert.icon}</span><span><b>${esc(J.alert.title)}</b>${J.alert.sub ? esc(J.alert.sub) : ''}</span>`);
  if(J.note && Date.now() - J.noteAt > 90000) J.note = null;
  $('note').hidden = !J.note; if(J.note) setHTML($('note'), J.note);

  if(s) setHTML($('banner'), `<div>${s.text}</div><div class="pills">${s.journey.legs.map(pill).join('<span class="sep">›</span>')}</div>
    <div class="row2"><button id="bSwitch" class="primary">Switch</button><button id="bKeep">Keep current</button></div>`);
  setHTML($('steps'), J.plan.legs.map(legRow).join(''));
  $('gmaps').href = gmapsLink(J.plan);
}

// ----- near you: live departures from the nearest stations and bus stops -----
let STIDX = null;
function stationIdx(){
  if(STIDX && STIDX.n === ACTIVE.filter(l => l.stops && Object.keys(l.stops).length).length) return STIDX.list;
  const by = new Map();
  for(const l of ACTIVE){ if(l.mode === 'bus' || !l.stops) continue;
    for(const [id, s] of Object.entries(l.stops)){
      const name = s.n.replace(/\s*\((?:[^)]*line|H&C|Circle Line|[^)]*Underground)[^)]*\)\s*/i, ' ').replace(/-Underground$/i, '').replace(/\s+/g, ' ').trim();

$('bReplan').onclick = () => { J.dismissed = null; J.lastReplan = 0; monitor(); };
$('bSwap').onclick = () => { const a = $('from').value; $('from').value = $('to').value; $('to').value = a; const f = J.from; J.from = J.to; J.to = f; };
setInterval(() => { if(geoErr && !me){ $('from').placeholder = 'Type a starting point'; const c = $('cs0'); if(c) c.placeholder = 'Type a starting point'; } }, 2000);
$('bLocate').onclick = () => { J.follow = true;
  if(me){ map.panTo(LL(me)); map.setZoom(Math.max(map.getZoom(), 15)); $('err').textContent = ''; }
  else $('err').textContent = geoErr === 'denied' ? 'Location is turned off for this site. Allow it in your browser\'s site settings.' : geoErr ? 'Your location isn\'t available right now.' : 'Finding your location…'; };
map.addListener('dragstart', () => { J.follow = false; $('tip').style.display = 'none'; hover = null; }); // also closes train info
map.addListener('zoom_changed', () => { $('tip').style.display = 'none'; hover = null; });
$('bTrains').onclick = () => {
  TRAINS_ON = !TRAINS_ON; try{ localStorage.setItem('trainsOn', TRAINS_ON?'1':'0'); }catch(e){}
  for(const l of ACTIVE) l.layer && l.layer.eachLayer(p => p.setStyle(lineStyle(l)));
  $('bTrains').classList.toggle('on', TRAINS_ON); refresh().catch(()=>{});
};
$('bTrains').classList.toggle('on', TRAINS_ON);
$('tsym').innerHTML = symbol('tube', '#DC241F', 16);
const GROUP_SYM = {tube:['tubeLogo','#DC241F'], overground:['tube','#FA7B05'], elizabeth:['tube','#60399E'], dlr:['tube','#00AFAD'], tram:['tube','#5FB526'], rail:['rail','#1D5BA0']};
function renderModeChips(){
  $('mModes').innerHTML = MODE_GROUPS.map(([m, name]) => {
    const has = ACTIVE.some(l => l.mode === m); // e.g. National Rail: not connected yet
    return `<button type="button" class="chip2" data-mode="${m}" aria-pressed="${has && !MODES_OFF.has(m)}" ${has ? '' : 'disabled title="Coming soon"'}>${symbol(GROUP_SYM[m][0], GROUP_SYM[m][1], 16)}${name}${has ? '' : ' <small>soon</small>'}</button>`;
  }).join('');
}
$('mModes').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if(!b || b.disabled) return;
  const m = b.dataset.mode; MODES_OFF.has(m) ? MODES_OFF.delete(m) : MODES_OFF.add(m);
  try{ localStorage.setItem('modesOff', JSON.stringify([...MODES_OFF])); }catch(x){}
  for(const l of ACTIVE) l.layer && l.layer.eachLayer(p => p.setStyle(lineStyle(l)));
  renderModeChips(); refresh().catch(()=>{}); });
function syncMapMenu(){ renderModeChips();
  for(const b of document.querySelectorAll('[data-ms]')) b.classList.toggle('sel', b.dataset.ms === MAP_STYLE);
  $('mQuiet').checked = QUIET_ON; $('mDark').checked = dark; $('mIcons').checked = SHOW_ICONS;
}
$('bMap').onclick = () => { const m = $('mapMenu'); m.hidden = !m.hidden; $('bMap').setAttribute('aria-expanded', !m.hidden); syncMapMenu(); };
$('mapMenu').addEventListener('click', e => { const b = e.target.closest('[data-ms]'); if(!b) return;
  MAP_STYLE = b.dataset.ms; try{ localStorage.setItem('mapStyle', MAP_STYLE); }catch(x){} applyTheme(); syncMapMenu(); });
$('mQuiet').onchange = () => { QUIET_ON = $('mQuiet').checked; try{ localStorage.setItem('mapQuiet', QUIET_ON ? '1' : '0'); }catch(x){} map.setOptions({styles:mapStyles()}); };
$('mIcons').onchange = () => { SHOW_ICONS = $('mIcons').checked; try{ localStorage.setItem('trainIcons', SHOW_ICONS ? '1' : '0'); }catch(x){}
  $('tip').style.display = 'none'; hover = null; };
$('mDark').onchange = () => { if($('mDark').checked !== dark) $('bTheme').click(); };
$('bTheme').onclick = () => { dark = !dark; try{ localStorage.setItem('theme', dark ? 'dark' : 'light'); }catch(x){} applyTheme(); syncMapMenu(); if(!$('chain').closest('[hidden]')) renderChain();
  const shown = J.plan || (J.options && J.options[J.sel]); if(shown) drawJourney(shown, routeLayer);
  if(J.suggestion) drawJourney(J.suggestion.journey, altLayer, true); };
window.onTrainsUpdate = n => { $('tcount').textContent = n ? n : ''; };
try{ const t = JSON.parse(localStorage.getItem('lastTo')); if(t){ J.to = t; $('to').value = t.label; } }catch(e){}
renderQuick();
// clearing the To box brings "near you" back
$('to').addEventListener('input', () => { if(!$('to').value.trim() && J.optEl === 'options' && J.options && J.options.length){ J.options = []; $('options').innerHTML = ''; drawJourney(null, routeLayer); renderNearby(); } });
const nbFirst = setInterval(() => { if(me){ clearInterval(nbFirst); renderNearby(); } }, 1000);
if(SIM) document.body.classList.add('sim');
// installable app: offline shell + notifications
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if(DEBUG) window.APP = {scr: p => scr(p), stationIdx, renderNearby, nb, map, draw, J, planJourneys, projectPlan, monitor, replan, setMe, startJourney, liveDepartures, ACTIVE, BY, trains, HL};
showView('search');
restoreState();

// ---------- boot: live trains in the background ----------
(async () => {
  const queue = ACTIVE.slice();
  await Promise.all([0,1,2,3,4].map(async () => { // first visit only: line shapes are cached for a week
    for(let l; (l = queue.shift()); ){
      const cached = !!store.get('seq2:'+l.id);
      try{ await loadLine(l); }catch(e){ console.warn('Could not load', l.name, e.message); }
      if(!cached) await sleep(80);
    }
  }));
  STIDX = null; if(me && !J.active) renderNearby(); // all stations known now
  for(;;){
    let good = false;
    try{ good = await refresh(); }catch(e){ console.error(e); }
    await sleep(good ? REFRESH : Math.min(REFRESH*8, REFRESH*2**Math.min(3, failStreak)));
  }
})();
})();
</script>
</body>
</html>
